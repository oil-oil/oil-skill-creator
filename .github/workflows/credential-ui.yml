name: 凭据组件跨平台验证

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: credential-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.18.0', '24']
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 准备 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: assets/credential-ui/package-lock.json
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: 安装组件依赖
        working-directory: assets/credential-ui
        run: npm ci --ignore-scripts
      - name: 类型与构建检查
        working-directory: assets/credential-ui
        run: |
          npm run check
          npm run build
          git diff --exit-code -- public/app.js
      - name: 配置脚本、正式页面交互、同页多 key 与 HTTP 会话测试
        working-directory: assets/credential-ui
        run: npm test
      - name: Skill 工具回归与严格校验
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_skill.py . --public --strict --weak-model --universal
      - name: Linux 准备系统凭据服务
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsecret-tools gnome-keyring dbus-x11
      - name: Linux 原生多 key 验证
        if: runner.os == 'Linux'
        working-directory: assets/credential-ui
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "FAKE_CI_KEYRING_UNLOCK" | gnome-keyring-daemon --unlock --components=secrets
            npm run test:native
          '
      - name: macOS 准备临时钥匙串
        if: runner.os == 'macOS'
        run: |
          credential_ci_keychain="$RUNNER_TEMP/credential-ui-ci.keychain-db"
          security create-keychain -p "" "$credential_ci_keychain"
          security list-keychains -d user -s "$credential_ci_keychain"
          security default-keychain -d user -s "$credential_ci_keychain"
          security unlock-keychain -p "" "$credential_ci_keychain"
          security set-keychain-settings -lut 21600 "$credential_ci_keychain"
      - name: macOS / Windows 原生多 key 验证
        if: runner.os != 'Linux'
        working-directory: assets/credential-ui
        run: npm run test:native
      - name: 清理 macOS 临时钥匙串
        if: always() && runner.os == 'macOS'
        run: |
          credential_ci_keychain="$RUNNER_TEMP/credential-ui-ci.keychain-db"
          if [ -f "$credential_ci_keychain" ]; then
            security delete-keychain "$credential_ci_keychain"
          fi
